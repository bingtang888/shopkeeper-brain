<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识库文件导入</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 32px 20px;
            background: #050810;
            overflow-x: hidden;
            position: relative;
        }

        /* === Animated Background Orbs === */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
        }
        body::before {
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.15), transparent 70%);
            top: -100px; left: -100px;
            animation: floatOrb1 20s ease-in-out infinite;
        }
        body::after {
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.12), transparent 70%);
            bottom: -150px; right: -150px;
            animation: floatOrb2 25s ease-in-out infinite;
        }
        @keyframes floatOrb1 {
            0%,100% { transform: translate(0,0); }
            50% { transform: translate(80px, 60px); }
        }
        @keyframes floatOrb2 {
            0%,100% { transform: translate(0,0); }
            50% { transform: translate(-60px, -80px); }
        }

        /* === Container === */
        .container {
            width: 100%;
            max-width: 820px;
            background: rgba(13, 18, 30, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: 40px 36px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow:
                0 40px 80px -20px rgba(0, 0, 0, 0.7),
                0 0 60px -20px rgba(56, 189, 248, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
            color: #e2e8f0;
            position: relative;
            z-index: 1;
        }

        /* === Header === */
        .header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
            padding-bottom: 28px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header-icon {
            width: 52px; height: 52px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(168, 85, 247, 0.2));
            border: 1px solid rgba(56, 189, 248, 0.25);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 0 24px rgba(56, 189, 248, 0.15);
            animation: iconPulse 4s ease-in-out infinite;
        }
        @keyframes iconPulse {
            0%,100% { box-shadow: 0 0 24px rgba(56, 189, 248, 0.15); }
            50% { box-shadow: 0 0 36px rgba(56, 189, 248, 0.3); }
        }
        .header-icon svg { width: 26px; height: 26px; stroke: #38bdf8; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

        .header-text h1 {
            font-size: 24px; font-weight: 800; margin: 0;
            background: linear-gradient(135deg, #38bdf8 0%, #a78bfa 50%, #f472b6 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }
        .header-text p { color: #64748b; font-size: 13px; margin-top: 4px; font-weight: 400; }

        /* === Upload Area === */
        .upload-area {
            border: 2px dashed rgba(56, 189, 248, 0.2);
            background: rgba(15, 23, 42, 0.3);
            border-radius: 16px;
            padding: 48px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 28px;
            position: relative;
            overflow: hidden;
        }
        .upload-area::before {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.05), rgba(168, 85, 247, 0.05));
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .upload-area:hover { border-color: rgba(56, 189, 248, 0.5); box-shadow: 0 0 40px rgba(56, 189, 248, 0.08); }
        .upload-area:hover::before { opacity: 1; }
        .upload-area.dragover {
            border-color: #38bdf8;
            box-shadow: 0 0 60px rgba(56, 189, 248, 0.15), inset 0 0 40px rgba(56, 189, 248, 0.05);
            transform: scale(1.01);
        }

        .upload-icon-wrapper {
            width: 72px; height: 72px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.12), rgba(168, 85, 247, 0.12));
            border: 1px solid rgba(56, 189, 248, 0.15);
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s ease;
            position: relative; z-index: 1;
        }
        .upload-area:hover .upload-icon-wrapper {
            transform: translateY(-4px);
            box-shadow: 0 8px 32px rgba(56, 189, 248, 0.2);
            border-color: rgba(56, 189, 248, 0.4);
        }
        .upload-icon-wrapper svg { width: 30px; height: 30px; stroke: #38bdf8; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

        .upload-text { color: #94a3b8; font-size: 16px; font-weight: 600; margin-bottom: 6px; position: relative; z-index: 1; }
        .upload-hint { color: #475569; font-size: 12px; font-weight: 400; position: relative; z-index: 1; }

        .file-input { display: none; }

        /* === File List === */
        .file-list { display: flex; flex-direction: column; gap: 16px; }

        .file-item {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 22px 24px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }
        .file-item::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            background: linear-gradient(180deg, #38bdf8, #a78bfa);
            opacity: 0.6;
            transition: opacity 0.25s ease;
        }
        .file-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px -8px rgba(0, 0, 0, 0.5), 0 0 24px -8px rgba(56, 189, 248, 0.1);
            border-color: rgba(56, 189, 248, 0.12);
        }
        .file-item:hover::before { opacity: 1; }

        .file-info { display: flex; flex-direction: column; flex: 1; margin-right: 20px; min-width: 0; }

        .file-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 12px; }
        .file-name { font-weight: 700; color: #f1f5f9; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .file-size { font-size: 12px; color: #64748b; font-weight: 600; flex-shrink: 0; font-variant-numeric: tabular-nums; }

        /* === Step Indicator === */
        .step-indicator {
            display: flex;
            align-items: center;
            gap: 0;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .step-dot {
            width: 24px; height: 24px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.08);
            background: rgba(15, 23, 42, 0.6);
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; font-weight: 700;
            color: #475569;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }
        .step-dot.step-done {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
        }
        .step-dot.step-running {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
            animation: stepPulse 1.5s ease-in-out infinite;
        }
        @keyframes stepPulse {
            0%,100% { box-shadow: 0 0 12px rgba(56, 189, 248, 0.3); }
            50% { box-shadow: 0 0 20px rgba(56, 189, 248, 0.5); }
        }
        .step-line {
            width: 20px; height: 2px;
            background: rgba(255, 255, 255, 0.06);
            flex-shrink: 0;
            transition: background 0.3s ease;
        }
        .step-line.line-done { background: rgba(16, 185, 129, 0.3); }

        /* === Status Badge === */
        .status-badge {
            padding: 6px 16px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            min-width: 76px;
            text-align: center;
            letter-spacing: 0.3px;
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; gap: 6px;
            transition: all 0.3s ease;
        }
        .status-uploading {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(245, 158, 11, 0.1));
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.1);
        }
        .status-processing {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(99, 102, 241, 0.15));
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 0 16px rgba(56, 189, 248, 0.15);
        }
        .status-completed {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(52, 211, 153, 0.1));
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
            box-shadow: 0 0 16px rgba(16, 185, 129, 0.15);
        }
        .status-error {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(239, 68, 68, 0.1));
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.1);
        }
        .status-badge .spinner {
            width: 12px; height: 12px;
            border: 2px solid currentColor;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        /* === Progress Bar === */
        .progress-wrapper { margin-top: 10px; display: none; }
        .progress-bar-container {
            width: 100%; height: 6px;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .progress-bar {
            height: 100%; width: 0%;
            border-radius: 3px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .progress-bar::after {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
            animation: shimmer 1.8s infinite;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .progress-text {
            font-size: 11px; color: #64748b;
            margin-top: 6px; text-align: right;
            font-variant-numeric: tabular-nums; font-weight: 700;
        }

        /* === Log Details === */
        .log-details {
            margin-top: 16px;
            font-size: 13px;
            color: #cbd5e1;
            background: rgba(8, 12, 22, 0.6);
            border-radius: 12px;
            padding: 16px 18px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .log-details summary {
            cursor: pointer; user-select: none;
            color: #94a3b8; outline: none;
            display: flex; align-items: center;
            font-weight: 600; font-size: 12px;
            letter-spacing: 0.2px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            list-style: none;
        }
        .log-details[open] summary { margin-bottom: 8px; }
        .log-details summary::-webkit-details-marker { display: none; }
        .log-details summary::before {
            content: '\25B8'; margin-right: 8px;
            font-size: 10px; color: #475569;
            transition: transform 0.2s ease;
        }
        .log-details[open] summary::before { transform: rotate(90deg); }
        .log-details summary:hover { color: #38bdf8; }

        .log-list {
            margin: 6px 0 0 0; padding: 0 0 0 22px;
            list-style: none;
            max-height: 240px;
            overflow-y: auto;
            position: relative;
        }
        .log-list::before {
            content: ''; position: absolute;
            left: 7px; top: 12px; bottom: 12px;
            width: 2px;
            background: linear-gradient(180deg, rgba(56, 189, 248, 0.25), rgba(168, 85, 247, 0.15), rgba(16, 185, 129, 0.2));
            border-radius: 1px;
        }
        .log-list::-webkit-scrollbar { width: 4px; }
        .log-list::-webkit-scrollbar-track { background: transparent; }
        .log-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }
        .log-list::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }

        .log-list li {
            padding: 8px 10px;
            line-height: 1.5;
            display: flex; align-items: center;
            position: relative;
            border-radius: 8px;
            transition: background 0.15s ease;
            font-size: 12.5px;
        }
        .log-list li:hover { background: rgba(255, 255, 255, 0.02); }
        .log-list li::before {
            content: '';
            position: absolute;
            left: -19px;
            width: 10px; height: 10px;
            border-radius: 50%;
            border: 2px solid #334155;
            background: #0a0f1a;
            z-index: 1;
            transition: all 0.3s ease;
        }
        .log-done { color: #86efac; }
        .log-done::before {
            background: #10b981 !important;
            border-color: #10b981 !important;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.35);
        }
        .log-duration {
            margin-left: auto;
            font-size: 11px; color: #67e8f9;
            background: rgba(56, 189, 248, 0.08);
            border: 1px solid rgba(56, 189, 248, 0.15);
            padding: 2px 10px; border-radius: 10px;
            white-space: nowrap; font-weight: 700;
            font-variant-numeric: tabular-nums; flex-shrink: 0;
        }
        .log-running { color: #93c5fd; animation: pulseText 2s infinite; }
        .log-running::before {
            background: #38bdf8 !important;
            border-color: #38bdf8 !important;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
            animation: pulseNode 2s infinite !important;
        }
        @keyframes pulseText { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
        @keyframes pulseNode {
            0%,100% { box-shadow: 0 0 10px rgba(56, 189, 248, 0.4); }
            50% { box-shadow: 0 0 18px rgba(56, 189, 248, 0.7); }
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="header-icon">
            <svg viewBox="0 0 24 24"><path d="M4 4h12l4 4v12a0 0 0 0 1 0 0H4z"/><line x1="16" y1="4" x2="16" y2="8"/><line x1="8" y1="4" x2="8" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="14" y2="16"/></svg>
        </div>
        <div class="header-text">
            <h1>知识库文件导入</h1>
            <p>上传 PDF 或 Markdown 文件，自动解析、切分、向量化并入库</p>
        </div>
    </div>

    <div class="upload-area" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <div class="upload-icon-wrapper">
            <svg viewBox="0 0 24 24"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M5 20h14"/></svg>
        </div>
        <div class="upload-text">点击或拖拽文件到此处</div>
        <div class="upload-hint">支持 PDF、Markdown 格式</div>
        <input type="file" id="fileInput" class="file-input" accept=".pdf,.md">
    </div>

    <div id="fileList" class="file-list"></div>
</div>

<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');

    // 模拟后端API地址
    const API_BASE = 'http://127.0.0.1:8000';

    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        handleFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener('change', (e) => {
        handleFiles(e.target.files);
    });

    function handleFiles(files) {
        Array.from(files).forEach(uploadFile);
    }

    function updateProgressUI(wrapper, percentage) {
        const bar = wrapper.querySelector('.progress-bar');
        const text = wrapper.querySelector('.progress-text');

        const safePercentage = Math.min(Math.max(percentage, 0), 100);

        bar.style.width = safePercentage + '%';
        text.textContent = Math.round(safePercentage) + '%';

        if (safePercentage >= 100) {
            bar.style.background = 'linear-gradient(90deg, #10b981, #34d399)';
            bar.style.boxShadow = '0 0 12px rgba(16, 185, 129, 0.4)';
        } else if (safePercentage < 10) {
            bar.style.background = 'linear-gradient(90deg, #f59e0b, #fbbf24)';
            bar.style.boxShadow = '0 0 8px rgba(245, 158, 11, 0.3)';
        } else {
            bar.style.background = 'linear-gradient(90deg, #38bdf8, #818cf8)';
            bar.style.boxShadow = '0 0 10px rgba(56, 189, 248, 0.3)';
        }
    }

    async function uploadFile(file) {
        // === 核心逻辑优化：动态判断总节点数 ===
        const isPDF = file.name.toLowerCase().endsWith('.pdf');
        // PDF 需要 9 步（含上传），MD 跳过 pdf_to_md 需要 8 步
        const totalNodes = isPDF ? 8 : 7;

        const id = 'file-' + Math.random().toString(36).substr(2, 8);
        const visibleSteps = totalNodes - 1;
        let stepDotsHtml = '';
        for (let s = 0; s < visibleSteps; s++) {
            stepDotsHtml += `<div class="step-dot" data-step="${s}">${s + 1}</div>`;
            if (s < visibleSteps - 1) stepDotsHtml += `<div class="step-line" data-line="${s}"></div>`;
        }

        const html = `
            <div class="file-item" id="${id}">
                <div class="file-info">
                    <div class="file-header">
                        <span class="file-name">${file.name}</span>
                        <span class="file-size">${(file.size / 1024).toFixed(2)} KB</span>
                    </div>
                    <div class="step-indicator">${stepDotsHtml}</div>
                    <div class="progress-wrapper">
                        <div class="progress-bar-container">
                            <div class="progress-bar"></div>
                        </div>
                        <div class="progress-text">0%</div>
                    </div>
                    <details class="log-details" open>
                        <summary>准备上传...</summary>
                        <ul class="log-list"></ul>
                    </details>
                </div>
                <div class="status-badge status-uploading"><span class="spinner"></span>上传中</div>
            </div>
        `;
        fileList.insertAdjacentHTML('afterbegin', html);

        const itemEl = document.getElementById(id);
        const statusBadge = itemEl.querySelector('.status-badge');
        const progressWrapper = itemEl.querySelector('.progress-wrapper');
        const logListEl = itemEl.querySelector('.log-list');

        const formData = new FormData();
        formData.append('file', file);

        try {
            progressWrapper.style.display = 'block';

            // 使用动态的 totalNodes 计算基础上传进度
            const uploadPercentage = (1 / totalNodes) * 100;
            updateProgressUI(progressWrapper, Math.min(uploadPercentage, 10));

            const initialLog = document.createElement('li');
            initialLog.textContent = "开始上传文件...";
            initialLog.className = "log-running";
            logListEl.appendChild(initialLog);

            const response = await fetch(`${API_BASE}/upload`, {
                method: 'POST',
                body: formData
            });

            if (!response.ok) throw new Error('Upload failed');

            const result = await response.json();
            const taskId = result.task_id;

            updateProgressUI(progressWrapper, uploadPercentage);
            statusBadge.innerHTML = '<span class="spinner"></span>处理中';
            statusBadge.className = 'status-badge status-processing';

            // 把专属的 totalNodes 传给轮询函数
            pollStatus(taskId, itemEl, totalNodes);

        } catch (error) {
            console.error(error);
            statusBadge.innerHTML = '上传失败';
            statusBadge.className = 'status-badge status-error';
            updateProgressUI(progressWrapper, 0);

            const errLog = document.createElement('li');
            errLog.textContent = "网络请求失败或服务器异常";
            errLog.style.color = "#ef4444";
            logListEl.appendChild(errLog);
        }
    }

    function normalizeLogText(text) {
        if (typeof text !== 'string') return String(text);
        return text;
    }

    // 接收 totalNodes 参数计算最终百分比和渲染文案
    function formatDuration(seconds) {
        if (seconds < 60) {
            return seconds.toFixed(1) + 's';
        }
        const mins = Math.floor(seconds / 60);
        const secs = (seconds % 60).toFixed(0);
        return `${mins}m${secs}s`;
    }

    function renderLogsAndCalculateProgress(itemEl, doneList, runningList, totalNodes, durations) {
        const logSummary = itemEl.querySelector('.log-details summary');
        const logListEl = itemEl.querySelector('.log-list');

        const done = Array.isArray(doneList) ? doneList : [];
        const running = Array.isArray(runningList) ? runningList : [];
        const durationMap = durations || {};

        // === 进度计算逻辑 ===
        let currentPercentage = (done.length / totalNodes) * 100;

        if (running.length > 0) {
            currentPercentage += (0.5 / totalNodes) * 100;
        }

        if (currentPercentage >= 100) {
            currentPercentage = 95;
        }

        // 计算总耗时
        let totalDuration = 0;
        for (const key in durationMap) {
            totalDuration += durationMap[key];
        }
        const totalDurationText = totalDuration > 0 ? ` | 总耗时: ${formatDuration(totalDuration)}` : '';

        // 更新日志文案
        logSummary.textContent = `运行日志 (已完成 ${done.length} / 共 ${totalNodes} 步${totalDurationText})`;

        // 更新步骤指示器
        const stepDots = itemEl.querySelectorAll('.step-dot');
        const stepLines = itemEl.querySelectorAll('.step-line');
        const visibleDone = done.filter(d => d !== 'upload_file').length;
        stepDots.forEach((dot, i) => {
            dot.classList.remove('step-done', 'step-running');
            if (i < visibleDone) dot.classList.add('step-done');
            else if (i === visibleDone && running.length > 0) dot.classList.add('step-running');
        });
        stepLines.forEach((line, i) => {
            line.classList.toggle('line-done', i < visibleDone - 1);
        });

        logListEl.innerHTML = '';

        for (const item of done) {
            if (item === 'upload_file') continue;

            const li = document.createElement('li');
            const nameSpan = document.createElement('span');
            nameSpan.textContent = `${normalizeLogText(item)} 节点执行完成`;
            li.appendChild(nameSpan);

            // 添加耗时标签
            if (durationMap[item] !== undefined) {
                const durationSpan = document.createElement('span');
                durationSpan.className = 'log-duration';
                durationSpan.textContent = formatDuration(durationMap[item]);
                li.appendChild(durationSpan);
            }

            li.className = 'log-done';
            logListEl.appendChild(li);
        }

        for (const item of running) {
            const li = document.createElement('li');
            li.textContent = `正在处理 ${normalizeLogText(item)} 节点...`;
            li.className = 'log-running';
            logListEl.appendChild(li);
        }

        logListEl.scrollTop = logListEl.scrollHeight;

        return currentPercentage;
    }

    function pollStatus(taskId, itemEl, totalNodes) {
        const statusBadge = itemEl.querySelector('.status-badge');
        const progressWrapper = itemEl.querySelector('.progress-wrapper');
        const logDetails = itemEl.querySelector('.log-details');
        let stopped = false;

        const interval = setInterval(async () => {
            if (stopped) return;

            try {
                const res = await fetch(`${API_BASE}/status/${taskId}`);
                if (!res.ok) throw new Error('Status request failed');

                const data = await res.json();

                if (stopped) return;

                // 传入 totalNodes 继续计算
                const calculatedPercentage = renderLogsAndCalculateProgress(itemEl, data.done_list, data.running_list, totalNodes, data.durations);

                if (data.status === 'completed') {
                    stopped = true;
                    clearInterval(interval);
                    statusBadge.innerHTML = '已完成';
                    statusBadge.className = 'status-badge status-completed';
                    updateProgressUI(progressWrapper, 100);

                    setTimeout(() => {
                        logDetails.open = false;
                    }, 1000);

                } else if (data.status === 'failed') {
                    stopped = true;
                    clearInterval(interval);
                    statusBadge.innerHTML = '失败';
                    statusBadge.className = 'status-badge status-error';

                    const logListEl = itemEl.querySelector('.log-list');
                    const errLog = document.createElement('li');
                    errLog.textContent = "工作流执行失败中止";
                    errLog.style.color = "#ef4444";
                    logListEl.appendChild(errLog);

                } else if (data.status === 'processing') {
                    updateProgressUI(progressWrapper, calculatedPercentage);
                }
            } catch (e) {
                console.error('Polling error', e);
            }
        }, 1500);
    }
</script>
